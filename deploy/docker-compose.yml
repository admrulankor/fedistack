services:
  postgres:
    image: postgres:16-alpine
    container_name: fedistack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fedistack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fedistack_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fedistack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fedistack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fedistack} -d ${POSTGRES_DB:-fedistack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: fedistack-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  fedistack_pgdata:
